name: Gradient determinism
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  golden-hashes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:gradients
