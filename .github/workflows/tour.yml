name: Tour checks
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_call:
    inputs:
      skip_tour_tests:
        description: Skip the tour unit-test gate for a release build
        required: false
        type: boolean
        default: false
      skip_tour_e2e:
        description: Skip the tour end-to-end gate for a release build
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tour:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check localization integrity
        run: npm run check:locales
      - name: Test localization checker
        run: npm run test:locales
      - name: Build-only Drive credentials
        shell: pwsh
        run: |
          @'
          export const DRIVE_CREDENTIALS = { clientId: '', clientSecret: '', scopes: ['https://www.googleapis.com/auth/drive.file'], redirectPort: 0 };
          '@ | Set-Content src/main/driveCredentials.ts
      - run: npx tsc --noEmit --incremental false
      - run: npm run lint:tour
      - name: Run tour unit tests
        if: ${{ !inputs.skip_tour_tests }}
        run: npm run test:tour
      - name: Record skipped release test gate
        if: ${{ inputs.skip_tour_tests }}
        shell: pwsh
        run: Add-Content $env:GITHUB_STEP_SUMMARY "Tour unit tests were skipped for this release build by request."
      - run: npx vite build
      - name: Run tour end-to-end tests
        if: ${{ !inputs.skip_tour_e2e }}
        run: npm run test:tour:e2e
      - name: Record skipped release E2E gate
        if: ${{ inputs.skip_tour_e2e }}
        shell: pwsh
        run: Add-Content $env:GITHUB_STEP_SUMMARY "Tour E2E tests were skipped for this release build by request."
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tour-failure
          path: test-results/
