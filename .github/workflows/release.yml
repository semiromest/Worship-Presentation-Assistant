name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tour-checks:
    uses: ./.github/workflows/tour.yml
    with:
      skip_tour_tests: ${{ github.ref_name == 'v1.4.20' }}
      skip_tour_e2e: ${{ github.ref_name == 'v1.4.20' }}
  build:
    needs: tour-checks
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch Git LFS objects
        run: git lfs pull

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Drive credentials
        shell: bash
        run: |
          cat > src/main/driveCredentials.ts <<'EOF'
          export const DRIVE_CREDENTIALS = {
            clientId: '${{ secrets.DRIVE_CLIENT_ID }}',
            clientSecret: '${{ secrets.DRIVE_CLIENT_SECRET }}',
            scopes: [
              'https://www.googleapis.com/auth/drive.file',
            ],
            redirectPort: 0,
          };
          EOF

      - name: Build Vite
        run: npx vite build

      - name: Package Electron artifacts
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Advisory for the first three releases; promotion requires explicit approval.
      - name: Packaged Windows tour and practice smoke
        id: packaged-smoke
        continue-on-error: true
        if: runner.os == 'Windows'
        run: node node_modules/@playwright/test/cli.js test --config playwright.packaged.config.cjs
      - name: Report advisory smoke result
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          "Packaged smoke (advisory): ${{ steps.packaged-smoke.outcome }}" >> $env:GITHUB_STEP_SUMMARY
          "Promotion to blocking requires approval after three observed releases." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload smoke diagnostics
        if: always() && runner.os == 'Windows' && steps.packaged-smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: packaged-tour-failure
          path: test-results/packaged-tour/

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: release/**
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Show release files
        run: find release-artifacts -type f | sort

      - name: Attach platform installers to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/**/Worship-Presentation-Assistant-*-Windows-Setup.exe
            release-artifacts/**/Worship-Presentation-Assistant-*.dmg
            release-artifacts/**/Worship-Presentation-Assistant-*.zip
            release-artifacts/**/latest.yml
            release-artifacts/**/latest-mac.yml
            release-artifacts/**/Worship-Presentation-Assistant-*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
