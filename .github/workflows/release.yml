name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Drive credentials from secrets
        shell: bash
        run: |
          cat > src/main/driveCredentials.ts <<'EOF'
          export const DRIVE_CREDENTIALS = {
            clientId: '${{ secrets.DRIVE_CLIENT_ID }}',
            clientSecret: '${{ secrets.DRIVE_CLIENT_SECRET }}',
            scopes: [
              'https://www.googleapis.com/auth/drive.file',
            ],
            redirectPort: 0,
          };
          EOF

      - name: Build
        run: npx vite build

      - name: Package & publish to GitHub Releases
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS'i imzasiz build et (Windows/Linux'u etkilemez).
          # Apple Developer imzalama/notarization hazir oldugunda bu satiri silip
          # asagidaki 5 secret'i env olarak ekle:
          #   CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          #   CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          #   APPLE_ID: ${{ secrets.APPLE_ID }}
          #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"