name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Drive credentials
        shell: bash
        run: |
          cat > src/main/driveCredentials.ts <<'EOF'
          export const DRIVE_CREDENTIALS = {
            clientId: '${{ secrets.DRIVE_CLIENT_ID }}',
            clientSecret: '${{ secrets.DRIVE_CLIENT_SECRET }}',
            scopes: [
              'https://www.googleapis.com/auth/drive.file',
            ],
            redirectPort: 0,
          };
          EOF

      - name: Build app
        run: npx vite build

      - name: Package and publish to GitHub Releases
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"